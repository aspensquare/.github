name: 🐛 Bug
description: Something's broken
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: whats-happening
    attributes:
      label: What's happening
      description: The actual (broken) behavior.
      placeholder: What's going wrong?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who or what is affected, and is it blocking? One line is fine.
      placeholder: e.g. blocks all publishes to OneSite for one property; workaround exists
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How to trigger it. Note if it's intermittent or you can't reproduce it consistently.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment / logs / screenshots
      description: Anything the code can't tell us — environment, logs, screenshots.
    validations:
      required: false
