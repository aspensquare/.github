name: 🧹 Chore
description: Maintenance — dependency bumps, cleanup, docs, internal changes
title: "[CHORE]: "
labels: ["maintenance"]
type: Task
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
      description: The maintenance task and the area it affects.
      placeholder: "e.g. Bump React to v18; clean up the auth module"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: Optional — what kind of maintenance.
      options:
        - Dependency update
        - Code cleanup / refactor
        - Configuration change
        - Build / tooling
        - Documentation
        - Other
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Why / context
      description: Optional — related issues or PRs, or rationale if it isn't self-evident.
      placeholder: "#1234"
    validations:
      required: false
