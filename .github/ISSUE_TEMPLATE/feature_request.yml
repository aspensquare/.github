name: ✨ Feature
description: Something we want built
title: "[FEATURE]: "
labels: ["enhancement"]
type: Feature
body:
  - type: textarea
    id: what
    attributes:
      label: What we want
      description: The change or capability.
      placeholder: What should exist that doesn't yet?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why / who asked
      description: The problem it solves or who requested it.
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: What does done look like
      description: How we'll know it's complete.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Mockups, links, examples.
    validations:
      required: false
